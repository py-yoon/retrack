name: Daily Data Sync Pipeline

on:
  schedule:
    # 매일 한국 시간(KST) 오전 6시 (UTC 21:00)에 실행
    - cron: '0 21 * * *'
  workflow_dispatch: # GitHub 웹 UI에서 수동 즉시 실행 가능

jobs:
  sync-data:
    name: Sync Seoul Urban Renewal Data
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Data Sync Pipeline
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SEOUL_OPENAPI_KEY: ${{ secrets.SEOUL_OPENAPI_KEY }}
        run: |
          echo "Starting daily data synchronization..."
          npm run data:sync

      - name: Run Data Audit & Integrity Check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "Running data audit report..."
          npm run data:audit
